<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carnatic Lesson Viewer V1.3</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 1cm; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .print-sheet { box-shadow: none !important; border: none !important; width: 100% !important; }
        }
        .category-card:hover { transform: translateY(-5px); transition: all 0.3s ease; }
        .lesson-card { cursor: pointer; transition: all 0.2s; }
        .lesson-card:hover { background-color: #f8fafc; border-color: #6366f1; }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .lower-octave, .upper-octave { position: relative; display: inline-block; }
        .lower-octave::after { content: ""; position: absolute; bottom: -3px; left: 50%; transform: translateX(-50%); background-color: currentColor; border-radius: 50%; width: 4px; height: 4px; }
        .upper-octave::after { content: ""; position: absolute; top: -3px; left: 50%; transform: translateX(-50%); background-color: currentColor; border-radius: 50%; width: 4px; height: 4px; }
        .speed-line-1 { border-bottom: 1.5px solid #000; padding-bottom: 1px; }
        .speed-line-2 { border-bottom: 3.5px double #000; padding-bottom: 1px; }
        .speed-line-3 { border-bottom: 4.5px double #000; border-top: 1px solid #000; padding-bottom: 2px; }
        .anga-break { border-right: 2px solid #64748b !important; }
        .avartham-end { border-right: 5px double #0f172a !important; }

        /* Zoom fix for mobile */
        html, body { overflow-x: hidden; width: 100%; }
        .preview-content-container { width: 100%; max-width: 100vw; overflow-x: hidden; }
        @media (max-width: 768px) { #view-viewer { padding-left: 0.75rem !important; padding-right: 0.75rem !important; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <nav class="bg-white border-b border-slate-200 p-4 sticky top-0 z-50 no-print shadow-sm">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3 cursor-pointer" onclick="showView('categories')">
                <span class="text-2xl">🎻</span>
                <h1 id="appTitle" class="text-lg font-bold tracking-tight">Carnatic Studio Viewer</h1>
            </div>
            <div class="flex items-center gap-2 w-full md:w-auto">
                <div class="flex bg-slate-100 p-1 rounded-lg">
                    <button type="button" onclick="event.stopPropagation(); setLanguage('en')" id="lang-en" class="px-3 py-1 rounded-md text-xs font-bold transition">EN</button>
                    <button type="button" onclick="event.stopPropagation(); setLanguage('te')" id="lang-te" class="px-3 py-1 rounded-md text-xs font-bold transition bg-white shadow-sm">తె</button>
                </div>
                <button onclick="window.print()" class="p-2 text-slate-400 hover:text-indigo-600 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg>
                </button>
            </div>
        </div>
    </nav>

    <main id="mainContainer" class="max-w-6xl mx-auto p-4 md:p-8">
        
        <!-- View 1: Categories -->
        <div id="view-categories" class="space-y-8 py-10">
            <div class="text-center space-y-2">
                <h2 id="heroTitle" class="text-3xl font-black text-slate-800 tracking-tight">Vidyalayam Library</h2>
                <p id="heroSubtitle" class="text-slate-500">Select the type of composition you want to practice</p>
            </div>
            <div id="categoryGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- Dynamic Categories will appear here -->
            </div>
        </div>

        <!-- View 2: Lesson List -->
        <div id="view-lessons" class="hidden space-y-6">
            <button id="backToCategoriesBtn" onclick="showView('categories')" class="flex items-center gap-2 text-indigo-600 font-bold text-sm hover:underline">
                ← Back to Categories
            </button>
            <h2 id="currentCategoryTitle" class="text-2xl font-black text-slate-800 uppercase tracking-wide"></h2>
            <div id="lessonGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Dynamic Lesson Cards will appear here -->
            </div>
        </div>

        <!-- View 3: Notation Viewer -->
        <div id="view-viewer" class="hidden bg-white shadow-xl rounded-3xl p-2 md:p-12 print-sheet relative preview-content-container">
            <button id="closeLessonBtn" onclick="showView('lessons')" class="no-print flex items-center gap-2 text-slate-400 font-bold text-xs hover:text-indigo-600 mb-6 md:absolute md:top-10 md:left-10 md:mb-0">
                ← Close Lesson
            </button>
            <div class="border-b-4 border-slate-900 pb-3 md:pb-6 mb-4 md:mb-8 text-center space-y-2 md:space-y-3">
                <h2 id="pubMainTitle" class="text-xl md:text-4xl font-serif font-black text-slate-900 tracking-tight uppercase leading-tight"></h2>
                <div id="composerContainer" class="flex flex-col items-center py-1">
                    <span id="pubLabelComposer" class="text-[10px] font-sans tracking-widest text-slate-400 font-bold uppercase"></span>
                    <p id="pubComposer" class="text-sm font-sans tracking-wide text-slate-600 font-semibold uppercase"></p>
                </div>
                <p class="text-[9px] md:text-[11px] text-slate-400 font-bold uppercase tracking-widest italic opacity-90 max-w-lg mx-auto leading-relaxed px-4">
                    Based on notes shared by <a href="https://www.youtube.com/@Nadasanathanam" target="_blank" class="text-slate-600 hover:text-indigo-600 underline">Guru PSSR Jagannadham</a> <br class="md:hidden"> of <span class="text-indigo-600">Sri Sai Lakshmi Music and Dance Institute</span>
                </p>
                <div class="grid grid-cols-2 gap-4 pt-3 border-t border-slate-100 text-sm font-serif text-slate-700 font-medium max-w-md mx-auto">
                    <div class="text-left"><span id="lblRaga"></span> <span id="metaRagaName" class="font-sans font-normal ml-1"></span></div>
                    <div class="text-right"><span id="lblTala"></span> <span id="metaTalaName" class="font-sans font-normal ml-1"></span></div>
                </div>
                <div id="metaScaleText" class="text-sm font-mono text-black font-bold pt-2"></div>
            </div>
            <div id="outputSheet" class="space-y-6 overflow-x-auto"></div>
        </div>
        
    </main>

    <script>
        const LANGUAGE_STORAGE_KEY = 'carnaticViewerLanguage';
        const uiPageText = {
            en: {
                appTitle: 'Carnatic Studio Viewer',
                heroTitle: 'Vidyalayam Library',
                heroSubtitle: 'Select the type of composition you want to practice',
                backToCategories: '← Back to Categories',
                closeLesson: '← Close Lesson',
                lessonsCountLabel: 'LESSONS'
            },
            te: {
                appTitle: 'కర్నాటిక్ స్టూడియో విజియర్',
                heroTitle: 'విద్యాలయం లైబ్రరీ',
                heroSubtitle: 'మీరు అభ్యసించాలనుకుంటున్న కూర్పు రకాన్ని ఎంచుకోండి',
                backToCategories: '← వర్గాలకు తిరిగి వెళ్ళు',
                closeLesson: '← పాఠాన్ని మూసివేయి',
                lessonsCountLabel: 'పాఠాలు'
            }
        };

        let currentLanguage = getStoredLanguage('te');
        let currentData = null;
        let lessonManifest = [];
        let currentCategory = null;
        let currentLessonFile = null;
        let currentView = 'categories';

        function getStoredLanguage(defaultLang = 'te') {
            const stored = localStorage.getItem(LANGUAGE_STORAGE_KEY);
            return stored === 'en' || stored === 'te' ? stored : defaultLang;
        }

        function persistLanguage(lang) {
            localStorage.setItem(LANGUAGE_STORAGE_KEY, lang);
        }

        function updateLanguageButtons(lang) {
            const baseClass = 'px-3 py-1 rounded-md text-xs font-bold transition';
            document.getElementById('lang-en').className = lang === 'en' ? `${baseClass} bg-white shadow-sm` : baseClass;
            document.getElementById('lang-te').className = lang === 'te' ? `${baseClass} bg-white shadow-sm` : baseClass;
        }

        function applyPageTranslations(lang) {
            const pack = uiPageText[lang];
            const appTitle = document.getElementById('appTitle');
            const heroTitle = document.getElementById('heroTitle');
            const heroSubtitle = document.getElementById('heroSubtitle');
            const backBtn = document.getElementById('backToCategoriesBtn');
            const closeBtn = document.getElementById('closeLessonBtn');
            if (appTitle) appTitle.innerText = pack.appTitle;
            if (heroTitle) heroTitle.innerText = pack.heroTitle;
            if (heroSubtitle) heroSubtitle.innerText = pack.heroSubtitle;
            if (backBtn) backBtn.innerHTML = `${pack.backToCategories}`;
            if (closeBtn) closeBtn.innerHTML = `${pack.closeLesson}`;
            document.documentElement.lang = lang;
        }

        const categoryMeta = {
            exercise: { icon: "🥁", color: "bg-indigo-50", text: { en: "Exercises", te: "అభ్యాసాలు" } },
            geetham:  { icon: "🎻", color: "bg-orange-50", text: { en: "Geethams", te: "గీతాలు" } },
            varnam:   { icon: "📜", color: "bg-blue-50", text: { en: "Varnams", te: "వర్ణాలు" } },
            krithi:   { icon: "🏛️", color: "bg-emerald-50", text: { en: "Krithis", te: "కృతులు" } }
        };

        const structuralLabels = { 
            en: { raga: "Raga:", tala: "Tala:", composer: "Composer", loading: "Loading Library...", arohana: "Arohana:", avarohana: "Avarohana:" }, 
            te: { raga: "రాగం:", tala: "తాళం:", composer: "రచయిత", loading: "లైబ్రరీ లోడ్ అవుతోంది...", arohana: "ఆరోహణ:", avarohana: "అవరోహణ:" } 
        };
        const sectionMap = { 
            en: { p: "Pallavi", ap: "Anupallavi", ms: "Mukthayi Swaram", ch: "Charanam", chi: "Chittaswaram", janta: "Janta", daatu: "Daatu", hechchu: "Hechchu", hechcchu: "Hechchu", swara: "Swara", swaram: "Swaram", swaras: "Swaras", swaralu: "Swaralu", tala: "Tala", talam: "Talam", sarali: "Sarali" }, 
            te: { p: "పల్లవి", ap: "అనుపల్లవి", ms: "ముక్తాయి స్వరం", ch: "చరణం", chi: "చిట్టస్వరం", janta: "జంట", daatu: "దాటు", hechchu: "హెచ్చు", hechcchu: "హెచ్చు", swara: "స్వరం", swaram: "స్వరం", swaras: "స్వరాలు", swaralu: "స్వరాలు", tala: "తాళం", talam: "తాళం", sarali: "సరళి" } 
        };
        const teluguToEnglishMap = {
            '\u0C05': 'a', '\u0C06': 'aa', '\u0C07': 'i', '\u0C08': 'ii', '\u0C09': 'u', '\u0C0A': 'uu', '\u0C0B': 'ru', '\u0C0E': 'e', '\u0C0F': 'ee', '\u0C10': 'ai', '\u0C12': 'o', '\u0C13': 'oo', '\u0C14': 'au',
            '\u0C15': 'ka', '\u0C16': 'kha', '\u0C17': 'ga', '\u0C18': 'gha', '\u0C19': 'gna', '\u0C1A': 'ca', '\u0C1B': 'cha', '\u0C1C': 'ja', '\u0C1D': 'jha', '\u0C1E': 'nya',
            '\u0C1F': 'ta', '\u0C20': 'tha', '\u0C21': 'da', '\u0C22': 'dha', '\u0C23': 'na', '\u0C24': 'tha', '\u0C25': 'thha', '\u0C26': 'da', '\u0C27': 'dha', '\u0C28': 'na',
            '\u0C2A': 'pa', '\u0C2B': 'pha', '\u0C2C': 'ba', '\u0C2D': 'bha', '\u0C2E': 'ma', '\u0C2F': 'ya', '\u0C30': 'ra', '\u0C31': 'ra', '\u0C32': 'la', '\u0C33': 'la', '\u0C34': 'lla', '\u0C35': 'va', '\u0C36': 'sha', '\u0C37': 'sha', '\u0C38': 'sa', '\u0C39': 'ha',
            '\u0C3E': 'aa', '\u0C3F': 'i', '\u0C40': 'ii', '\u0C41': 'u', '\u0C42': 'uu', '\u0C43': 'ru', '\u0C46': 'e', '\u0C47': 'ee', '\u0C48': 'ai', '\u0C4A': 'o', '\u0C4B': 'oo', '\u0C4C': 'au', '\u0C4D': '', '\u0C01': '', '\u0C02': '', '\u0C03': 'h'
        };
        const scriptMap = { en: { s: "S", r: "R", g: "G", m: "M", p: "P", d: "D", n: "N", comma: ",", semicolon: ";" }, te: { s: "స", r: "రి", g: "గ", m: "మ", p: "ప", d: "ద", n: "ని", comma: ",", semicolon: ";" } };
        const normalizationMap = { "స": "s", "రి": "r", "గ": "g", "మ": "m", "ప": "p", "ద": "d", "ని": "n", "న": "n", "s": "s", "r": "r", "g": "g", "m": "m", "p": "p", "d": "d", "n": "n" };
        const talaBlueprints = { adi: { beats: 8, bars: [4, 6] }, varna_adi: { beats: 32, bars: [16, 24] }, adi_double: { beats: 16, bars: [4, 6, 8, 12, 14] }, dhruva: { beats: 14, bars: [4, 6, 10] }, matya: { beats: 10, bars: [4, 6] }, rupaka: { beats: 6, bars: [2] }, jhampa: { beats: 10, bars: [7, 8] }, triputa: { beats: 7, bars: [3, 5] }, ata: { beats: 14, bars: [5, 10] }, eka: { beats: 4, bars: [] } };

        window.onload = async () => {
            currentLanguage = getStoredLanguage('te');
            updateLanguageButtons(currentLanguage);
            applyPageTranslations(currentLanguage);

            const grid = document.getElementById('categoryGrid');
            grid.innerHTML = `<div class="col-span-full py-20 text-slate-400 font-bold animate-pulse">${structuralLabels[currentLanguage].loading}</div>`;
            
            try {
                const response = await fetch('./lessons/manifest.json?t=' + Date.now());
                lessonManifest = await response.json();
            } catch (e) {
                console.warn("Could not load manifest.json. Falling back to internal list.");
                lessonManifest = [
                    { file: "lambodara.json", title: { en: "Lambodara", te: "లంబోదర" }, type: "geetham" },
                    { file: "shakti_sahita.json", title: { en: "Shakti Sahita", te: "శక్తి సహిత" }, type: "exercise" }
                ];
            }
            renderCategories();
        };

        function showView(viewId) {
            currentView = viewId;
            document.querySelectorAll('main > div').forEach(div => div.classList.add('hidden'));
            document.getElementById(`view-${viewId}`).classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function renderCategories() {
            const grid = document.getElementById('categoryGrid');
            grid.innerHTML = '';
            const pack = uiPageText[currentLanguage];
            Object.keys(categoryMeta).forEach(cat => {
                const lessons = lessonManifest.filter(l => l.type === cat);
                if (lessons.length === 0) return; // Hide empty categories

                const meta = categoryMeta[cat];
                const count = lessons.length;
                const div = document.createElement('div');
                div.className = `${meta.color} p-8 rounded-3xl border border-slate-200 category-card cursor-pointer text-center space-y-3`;
                div.onclick = () => showLessonsInCategory(cat);
                div.innerHTML = `
                    <div class="text-4xl">${meta.icon}</div>
                    <div class="text-xl font-black text-slate-800">${meta.text[currentLanguage]}</div>
                    <div class="text-xs font-bold text-slate-400 uppercase tracking-tighter">${count} ${pack.lessonsCountLabel}</div>
                `;
                grid.appendChild(div);
            });
            showView('categories');
        }

        function showLessonsInCategory(cat) {
            currentCategory = cat;
            const grid = document.getElementById('lessonGrid');
            grid.innerHTML = '';
            const filtered = lessonManifest.filter(l => l.type === cat);
            document.getElementById('currentCategoryTitle').innerText = categoryMeta[cat].text[currentLanguage];
            
            filtered.forEach(lesson => {
                const title = (typeof lesson.title === 'object') ? lesson.title[currentLanguage] : lesson.title;
                const card = document.createElement('div');
                card.className = "bg-white border border-slate-200 p-5 rounded-2xl shadow-sm lesson-card flex justify-between items-center";
                card.onclick = () => loadLesson(lesson.file);
                card.innerHTML = `
                    <div>
                        <h4 class="font-bold text-slate-800">${title}</h4>
                        <p class="text-xs text-slate-400 italic">${lesson.raga || ''}</p>
                    </div>
                    <span class="text-indigo-400">→</span>
                `;
                grid.appendChild(card);
            });
            showView('lessons');
        }

        async function loadLesson(fileName) {
            currentLessonFile = fileName;
            try {
                const response = await fetch(`./lessons/${fileName}`);
                currentData = await response.json();
                render();
                showView('viewer');
            } catch (e) {
                alert("Error loading lesson file. Ensure it exists in the /lessons/ folder.");
            }
        }

        function setLanguage(lang) {
            currentLanguage = lang;
            persistLanguage(lang);
            updateLanguageButtons(lang);
            applyPageTranslations(lang);

            if (currentView === 'viewer') {
                if (currentData) {
                    render();
                } else if (currentLessonFile) {
                    loadLesson(currentLessonFile).catch(() => {});
                }
                return;
            }

            if (currentView === 'lessons' && currentCategory) {
                showLessonsInCategory(currentCategory);
                return;
            }

            if (currentView === 'categories') {
                renderCategories();
                return;
            }

            showView(currentView);
        }
        
        

        function transliterateSwara(atom) {
            if (!atom) return scriptMap[currentLanguage].comma;
            let cleaner = atom.trim();
            if (cleaner.toLowerCase() === 'b' || cleaner === ';') return scriptMap[currentLanguage].semicolon;
            if (cleaner === ',' || cleaner === '-' || cleaner.toLowerCase() === 'c') return scriptMap[currentLanguage].comma;
            let isLowerOctave = cleaner.startsWith('.') || cleaner.endsWith('.') || cleaner.toLowerCase().endsWith('l');
            let isUpperOctave = cleaner.includes("'") || cleaner.includes('*') || cleaner.toLowerCase().endsWith('u');
            let baseChar = cleaner.replace(/[\.\*'\s,uUlL]/g, '');
            let mapped = scriptMap[currentLanguage][normalizationMap[baseChar.toLowerCase()] || baseChar.toLowerCase()] || baseChar;
            if (isLowerOctave) return `<span class="lower-octave">${mapped}</span>`;
            if (isUpperOctave) return `<span class="upper-octave">${mapped}</span>`;
            return `<span>${mapped}</span>`;
        }

        function parseBeatBlockToHTML(block) {
            if (!block || [',','-','_','c'].includes(block.toLowerCase())) return `<div class="text-black font-bold">${scriptMap[currentLanguage].comma}</div>`;
            if (['b',';'].includes(block.toLowerCase())) return `<div class="text-black font-bold">${scriptMap[currentLanguage].semicolon}</div>`;
            const atoms = block.match(/ql[l]*|e|[srgmpdnSRGMPDN\u0C15-\u0C4D][\'\* \.bBuUlL]?|[\u0C00-\u0C7F]+|[,;cC]/g) || [block];
            let cols = atoms.length === 2 ? "grid-cols-2 text-sm" : (atoms.length > 2 ? "grid-cols-4 text-xs tracking-tighter" : "grid-cols-1");
            let atomsHTML = atoms.filter(a => !['ql','qll','qlll','e'].includes(a)).map(a => `<div class="text-center font-bold relative">${transliterateSwara(a)}</div>`).join('');
            let speed = atoms.includes('qlll') ? 3 : (atoms.includes('qll') ? 2 : (atoms.includes('ql') ? 1 : 0));
            let content = `<div class="grid ${cols} gap-0.5 items-center justify-center w-full">${atomsHTML}</div>`;
            return speed > 0 ? `<div class="speed-line-${speed} w-full">${content}</div>` : content;
        }

        function tokenizeLineData(raw, isSwara) {
            let trimmed = raw.trim(); if (!trimmed) return [];
            if (isSwara && trimmed.startsWith('<')) return [trimmed];
            
            if (!isSwara) {
                const tokens = [];
                const chunks = trimmed.split(/\s+/).filter(Boolean);
                chunks.forEach(chunk => {
                    let i = 0;
                    while (i < chunk.length) {
                        const char = chunk[i];
                        if (char === '.' || char === ',' || char === ';' || char === ':') {
                            tokens.push(char);
                            i += 1;
                            continue;
                        }
                        if (/[a-zA-Z0-9\u0027]/.test(char)) {
                            tokens.push(char);
                            i += 1;
                            continue;
                        }
                        if (/[\u0C15-\u0C39]/.test(char)) {
                            let syllable = char;
                            let j = i + 1;
                            while (j < chunk.length) {
                                const next = chunk[j];
                                if (next === '.' || next === ',' || next === ';' || next === ':') break;
                                if (/[\u0C3E-\u0C4C]/.test(next)) {
                                    syllable += next;
                                    j += 1;
                                    break;
                                }
                                if (next === '\u0C4D') {
                                    syllable += next;
                                    j += 1;
                                    continue;
                                }
                                if (/[\u0C15-\u0C39]/.test(next)) {
                                    break;
                                }
                                break;
                            }
                            tokens.push(syllable);
                            i = j;
                            continue;
                        }
                        tokens.push(char);
                        i += 1;
                    }
                });
                return tokens;
            }

            let tokens = trimmed.split(/\s+/).flatMap(w => w.match(/qlll|qll|ql|[srgmpdnSRGMPDN\u0C15-\u0C4D][\'\* \.bBuUlL]?|[\u0C00-\u0C7F]+|[,;\-_bBcC]/g) || [w]);
            let grouped = [], current = [], inSpeed = false;
            tokens.forEach(t => {
                if (['ql','qll','qlll'].includes(t)) { inSpeed = true; current.push(t); }
                else if (t === 'e') { current.push(t); grouped.push(current.join(' ')); current = []; inSpeed = false; }
                else if (inSpeed) current.push(t);
                else if (t === 'b') { if (grouped.length > 0) grouped[grouped.length-1] += ' b'; else grouped.push('b'); }
                else grouped.push(t);
            });
            return grouped;
        }

        function transliterateTeluguToEnglish(token) {
            if (!token || token === '.') return "";
            const normalizedToken = String(token).trim();
            if (!normalizedToken) return "";
            if (/^[a-zA-Z0-9\u0027]+$/.test(normalizedToken)) return normalizedToken;

            let res = "";
            for (let i = 0; i < normalizedToken.length; i++) {
                const char = normalizedToken[i];
                const prevChar = normalizedToken[i - 1];
                const nextChar = normalizedToken[i + 1];
                const mapped = teluguToEnglishMap[char] || "";
                const isConsonant = /[\u0C15-\u0C39]/.test(char);
                const isVowelSign = /[\u0C3E-\u0C4C]/.test(char);
                const isIndependentVowel = /[\u0C05-\u0C14]/.test(char);
                const prevWasVowelSign = /[\u0C3E-\u0C4C]/.test(prevChar || "");

                if (char === '.') { res += '.'; continue; }
                if (char === '\u0C4D') continue;
                if (char === '\u0C02') { res += prevWasVowelSign ? 'n' : 'm'; continue; }
                if (char === '\u0C01' || char === '\u0C03') { res += 'h'; continue; }

                if (isIndependentVowel) {
                    res += mapped || "";
                    continue;
                }

                if (isVowelSign) {
                    const vowelValue = mapped === 'o' ? 'ō' : (mapped === 'oo' ? 'ō' : mapped);
                    if (vowelValue && res.endsWith('a')) {
                        res = res.slice(0, -1) + vowelValue;
                    } else if (vowelValue) {
                        res += vowelValue;
                    }
                    continue;
                }

                if (isConsonant) {
                    if (nextChar && /[\u0C3E-\u0C4C]/.test(nextChar)) {
                        const vowelValue = teluguToEnglishMap[nextChar] || "";
                        const normalizedVowel = vowelValue === 'o' ? 'ō' : (vowelValue === 'oo' ? 'ō' : vowelValue);
                        const base = mapped ? mapped.slice(0, -1) : "";
                        res += base + normalizedVowel;
                        i += 1;
                    } else {
                        res += mapped || "";
                    }
                    continue;
                }

                if (mapped) res += mapped;
                else res += char;
            }

            return res
                .replace(/aa/g, 'ā')
                .replace(/ii/g, 'ī')
                .replace(/uu/g, 'ū')
                .replace(/ee/g, 'ē')
                .replace(/oo/g, 'ō')
                .replace(/o/g, 'ō');
        }

        function getAtomicCount(beatBlock) {
            if (!beatBlock || beatBlock === ',' || beatBlock === ';') return 1;
            // Matches atoms within a block (handling speed markers)
            const atoms = beatBlock.match(/[srgmpdnSRGMPDN\u0C15-\u0C4D][\'\* \.bBuUlL]?|[\u0C00-\u0C7F]+|[,;cC]/g);
            return atoms ? atoms.length : 1;
        }

        function transliterateScale(str) {
            if (!str) return "";
            return str.split(/\s+/).filter(t => t.trim() !== "").map(token => {
                let cleaner = token.trim();
                let isLower = cleaner.startsWith('.') || cleaner.endsWith('.') || cleaner.toLowerCase().endsWith('l');
                let isUpper = cleaner.includes("'") || cleaner.includes('*') || cleaner.toLowerCase().endsWith('u');
                let letter = (cleaner.match(/[srgmpdnSRGMPDN]/i) || [""])[0].toLowerCase();
                if (!letter) return cleaner;
                let mapped = scriptMap[currentLanguage][normalizationMap[letter] || letter] || letter;
                let res = cleaner.replace(/[srgmpdnSRGMPDN]/i, mapped).replace(/[\.\*\'uUlL]/g, '');
                if (isLower) return `<span class="lower-octave">${res}</span>`;
                if (isUpper) return `<span class="upper-octave">${res}</span>`;
                return `<span>${res}</span>`;
            }).join(' ');
        }

        function render() {
            const d = currentData;
            const lang = currentLanguage;
            const comp = (d.composers && d.composers[lang]) || d.composer || '';
            
            document.getElementById('pubMainTitle').innerText = (d.titles && d.titles[lang]) || d.title || '';
            document.getElementById('pubComposer').innerText = comp;
            document.getElementById('metaRagaName').innerText = (d.ragas && d.ragas[lang]) || d.raga || '';
            document.getElementById('metaTalaName').innerText = (d.talaNames && d.talaNames[lang]) || d.talaName || '';
            document.getElementById('pubLabelComposer').innerText = structuralLabels[lang].composer;
            document.getElementById('lblRaga').innerText = structuralLabels[lang].raga;
            document.getElementById('lblTala').innerText = structuralLabels[lang].tala;
            document.getElementById('composerContainer').className = comp ? "flex flex-col items-center" : "hidden";
            
            const sAro = transliterateScale(d.arohana || d.arohanam || "");
            const sAva = transliterateScale(d.avarohana || d.avarohanam || "");
            const labels = structuralLabels[lang];
            let scaleHTML = "";
            scaleHTML += `<div class="flex flex-col md:flex-row items-center md:justify-center md:gap-x-6 gap-y-1">`;
            if (sAro) scaleHTML += `<div class="flex gap-x-2"><span>${labels.arohana}</span> <span class="font-bold">${sAro}</span></div>`;
            if (sAva) scaleHTML += `<div class="flex gap-x-2"><span>${labels.avarohana}</span> <span class="font-bold">${sAva}</span></div>`;
            scaleHTML += `</div>`;
            document.getElementById('metaScaleText').innerHTML = scaleHTML;

            const talaKey = d.tala || 'adi';
            const blueprint = talaBlueprints[talaKey] || talaBlueprints.rupaka;
            const swaraLines = (d.swaras || "").split('\n');
            const sahityaLines = (d.sahitya || "").split('\n');
            const output = document.getElementById('outputSheet');
            output.innerHTML = '';
            let currentSection = null;
            let sahityaLinePointer = 0;
            const isExercise = (d.compType === 'exercise' || d.type === 'exercise');

            swaraLines.forEach((line, idx) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('<')) {
                    currentSection = document.createElement('div');
                    currentSection.className = "mb-8 break-inside-avoid";
                    output.appendChild(currentSection);
                    let rawText = trimmed.replace(/[<>]/g, '');
                    let translatedText = rawText.split(/\s+/).map(word => {
                        let key = word.toLowerCase();
                        return sectionMap[lang][key] || word;
                    }).join(' ');
                    let div = document.createElement('div');
                    div.className = "text-center py-2 border-y border-dashed border-slate-300 my-4 font-serif font-bold text-indigo-900 text-sm bg-slate-50";
                    div.innerText = translatedText;
                    currentSection.appendChild(div); 
                    
                    // Sync Sahitya: Re-align if a matching tag is found anywhere in Sahitya
                    let swaraTag = trimmed.trim().toLowerCase();
                    let foundIdx = sahityaLines.findIndex(l => l.trim().toLowerCase() === swaraTag);
                    if (foundIdx !== -1) {
                        sahityaLinePointer = foundIdx + 1;
                    }
                    
                    // Sync Sahitya: Skip empty lines and consume tag if it matches
                    while (sahityaLines[sahityaLinePointer] !== undefined && sahityaLines[sahityaLinePointer].trim() === '') {
                        sahityaLinePointer++;
                    }
                    if (sahityaLines[sahityaLinePointer] && sahityaLines[sahityaLinePointer].trim().startsWith('<')) {
                        sahityaLinePointer++;
                    }
                    return;
                }
                if (!currentSection) { currentSection = document.createElement('div'); currentSection.className = "mb-8 break-inside-avoid"; output.appendChild(currentSection); }
                
                // Skip empty lines in sahitya
                while (sahityaLines[sahityaLinePointer] !== undefined && sahityaLines[sahityaLinePointer].trim() === '') {
                    sahityaLinePointer++;
                }

                const sBeats = tokenizeLineData(line, true);
                let currentSahityaLine = '';
                if (sahityaLines[sahityaLinePointer] !== undefined && !sahityaLines[sahityaLinePointer].trim().startsWith('<')) {
                    currentSahityaLine = sahityaLines[sahityaLinePointer++];
                }
                const lyTokens = tokenizeLineData(currentSahityaLine, false);
                let lyIndex = 0;

                // Logic to break rows on mobile portrait to prevent horizontal overflow/zoom issues
                let beatsPerRow = blueprint.beats; // Initialize beatsPerRow
                const isPortrait = window.matchMedia("(orientation: portrait)").matches;
                const isMobileWidth = window.innerWidth < 1024; // Use 1024 to match the LG breakpoint

                if (isPortrait && isMobileWidth) {
                    if (blueprint.beats === 14) beatsPerRow = 7; // Dhruva, Ata
                    else if (blueprint.beats === 10) beatsPerRow = 5; // Matya, Jhampa
                    else if (blueprint.beats === 32 || blueprint.beats === 16) beatsPerRow = 8; // Varna Adi, Adi Double
                    else if (blueprint.beats === 8 && window.innerWidth < 450) beatsPerRow = 4; // Adi Tala on small phones
                    else if (blueprint.beats > 8) beatsPerRow = 8; // General case for >8 beats in portrait
                } else {
                    // No change: landscape and laptop keep full blueprint.beats (up to 16)
                }

                const rowsCount = Math.ceil(blueprint.beats / beatsPerRow);

                for (let r = 0; r < rowsCount; r++) {
                    const grid = document.createElement('div');
                    grid.className = `grid bg-white border border-slate-200 rounded-lg overflow-hidden w-full mb-2`;
                    grid.style.gridTemplateColumns = `repeat(${beatsPerRow}, minmax(0, 1fr))`;

                    for (let i = r * beatsPerRow; i < Math.min((r + 1) * beatsPerRow, blueprint.beats); i++) {
                        const currentBeatSwara = sBeats[i] || ',';
                        const atomsInBeat = getAtomicCount(currentBeatSwara);

                    const tile = document.createElement('div');
                    tile.className = "px-1 py-1.5 md:p-2 flex flex-col justify-between items-center min-h-[52px] md:min-h-[64px] border-r border-slate-100 tile-cell";
                    
                    const isDoubleBar = (i === blueprint.beats - 1) || (talaKey === 'adi_double' && i === 7);
                    if (isDoubleBar) {
                        tile.classList.add("avartham-end");
                    } else if (blueprint.bars.includes(i + 1)) {
                        tile.classList.add("anga-break");
                    }
                    
                    const sDiv = document.createElement('div');
                    sDiv.className = "w-full text-center flex justify-center items-center h-6 md:h-8 text-slate-900 font-mono text-[16px] sm:text-sm md:text-lg tracking-tighter md:tracking-normal";
                    sDiv.innerHTML = parseBeatBlockToHTML(currentBeatSwara);
                    tile.appendChild(sDiv);
                    
                    if (!isExercise) {
                        let beatSahitya = [];
                        for(let a=0; a < atomsInBeat; a++) {
                            let token = lyTokens[lyIndex++] || '';
                            if (token === 'c' || token === ',' || token === '.') {
                                beatSahitya.push('<span class="opacity-40">.</span>');
                            } else if (token) {
                                let en = transliterateTeluguToEnglish(token);
                                if (currentLanguage === 'en') {
                                    beatSahitya.push(`<span class="text-slate-800 font-medium">${en || token}</span>`);
                                } else {
                                    beatSahitya.push(`<span>${token}</span>`);
                                }
                            } else beatSahitya.push('');
                        }
                        const lyDiv = document.createElement('div');
                        lyDiv.className = "text-center text-[16px] md:text-[11px] text-green-700 w-full mt-1 md:mt-2 font-sans font-bold tracking-tighter md:tracking-wide border-t border-slate-50 pt-0.5 md:pt-1 leading-tight flex justify-around gap-0.5 md:gap-1";
                        lyDiv.innerHTML = beatSahitya.join(' ');
                        tile.appendChild(lyDiv);
                    }
                    grid.appendChild(tile);
                    }
                    currentSection.appendChild(grid);
                }
            });
        }
    </script>

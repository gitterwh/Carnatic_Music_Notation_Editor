name: Auto-Generate Lesson Manifest
on:
  push:
    paths:
      - 'lessons/**.json'
      - '!lessons/manifest.json'

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate manifest.json
        shell: bash
        run: |
          cd lessons
          shopt -s nullglob
          echo "Generating manifest..."
          
          # Process each json file and combine into a single array
          for f in *.json; do
            if [[ "$f" != "manifest.json" ]]; then
              jq -c --arg fname "$f" '{file: $fname, title: (.titles // {en: .title, te: .title}), type: .compType, raga: (.ragas.en // .raga // "")}' "$f"
            fi
          done | jq -s '.' > manifest.json || echo "[]" > manifest.json

      - name: Commit and Push Manifest
        run: |
          git config user.name "Carnatic-Bot"
          git config user.email "bot@carnaticstudio.com"
          git add lessons/manifest.json
          if git commit -m "Auto-update lesson manifest [skip ci]"; then
            git push
          else
            echo "No changes to manifest"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
